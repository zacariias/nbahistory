<script src="https://d3js.org/d3.v3.min.js" charset="utf-8"></script>
<script src="https://labratrevenge.com/d3-tip/javascripts/d3.tip.v0.6.3.js"></script>
<body>
<div id="navigation">
<p id="button"><a href="https://www.nbahistory.org">Teams</a> <span>Championships</span></p>
</div>
<input id="slider" type="range" min="1946" max="2025" step="1" value="1946">
<svg class="championships"></svg>
<script>
var margin = {top:40,right:80,bottom:30,left:0},
    width = 1200 - margin.left - margin.right,
    height = 720 - margin.top - margin.bottom,
    buffer = height + 5;
var x = d3.scale
    .linear()
    .domain([0,20])
    .range([0,width]);
var y = d3.scale
    .linear()
    .domain([0,15])
    .range([height,0]);
var xAxis = d3.svg.axis()
    .scale(x)
    .orient("bottom");
var svg = d3.select(".championships")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
    .attr("id","center")
    .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
var tip = d3.tip()
    .attr('class', 'tooltip2')
    .offset([-20, 0])
    .html(function(d) {return "<p>" + d.team + "</p>" + d.years });
svg.append("g")
    .attr("class", "x axis")
    .attr("transform", "translate(20," + buffer + ")")
    .call(xAxis.ticks(20).tickSize(0).tickPadding(10))
    .append("text")
    .attr("id", "year")
    .attr("x", width/2)
    .attr("y", -245)
    .style("text-anchor", "middle")
    .style("fill", "rgba(0, 0, 0, 0.5)")
    .text("1946");
svg.append("image")
    .attr("xlink:href", "trophy.png")
    .attr("width", "40")
    .attr("height", "40")
    .attr("x", width + 45)
    .attr("y", height - 15);
svg.call(tip);
d3.select("#slider").on("input", function() {
    update(+this.value);
});
function update(slider) {
    d3.select("#year").text(slider);
    d3.csv("championships/" + slider + ".csv", function(error, data) {
            svg.selectAll(".logo").remove();
            svg.selectAll(".logo")
            .data(data)
            .enter()
            .append("image")
            .attr("xlink:href", function(d) { return d.logo; })
            .attr("x", function(d) { return x(d.championships); })
            .attr("y", function(d) { return y(d.stack); })
            .attr("width", "40")
            .attr("height", "40")
            .attr("class", "logo")
            .on('mouseover', function(d) {tip.show(d);
            d3.select(this).style("opacity", "0.5");})
            .on('mouseout', function(d) {tip.hide(d); d3.select(this).style("opacity", "1");});
    });
};
</script>
