<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
var margin1 = {top:10,right:0,bottom:80,left:180},
    width1 = 1200 - margin1.left - margin1.right
    height1 = 385 - margin1.top - margin1.bottom;
var margin2 = {top:10,right:0,bottom:80,left:180},
    width2 = 1200 - margin2.left - margin2.right
    height2 = 240 - margin2.top - margin2.bottom;
var margin3 = {top:10,right:0,bottom:10,left:180},
    width3 = 1200 - margin3.left - margin3.right
    height3 = 170 - margin3.top - margin3.bottom;
var x = d3.scaleBand()
    .rangeRound([0,width1])
    .padding(0.2);
var y1 = d3.scaleLinear()
    .domain([0,1])
    .range([height1,0]);
var y2 = d3.scaleLinear()
    .domain([-15,15])
    .range([height2,0]);
var y3 = d3.scaleLinear()
    .domain([0,1])
    .range([height3,0]);
var xAxis = d3.axisBottom(x);
var formatDecimal = d3.format(".3f");
var y1Axis = d3.axisLeft(y1)
    .tickSizeInner(-width1)
    .tickPadding(10)
    .tickFormat(formatDecimal);
var formatDecimal = d3.format(".0f");
var y2Axis = d3.axisLeft(y2)
    .tickSizeInner(-width2)
    .tickPadding(10)
    .tickFormat(formatDecimal);
var y3Axis = d3.axisLeft(y3)
    .tickSizeInner(-width3)
    .tickPadding(10)
    .ticks(5)
    .tickFormat(function(d){
        if(d==0){return "Missed Playoffs"}
        else if(d==0.2){return "Lost First Round"}
        else if(d==0.4){return "Lost Conf/Div Semis"}
        else if(d==0.6){return "Lost Conf/Div Finals"}
        else if(d==0.8){return "Lost Finals"}
        else{return "Won Finals"}});
var regularseason = d3.select(".regularseason")
    .attr("width",width1 + margin1.left + margin1.right)
    .attr("height",height1 + margin1.top + margin1.bottom)
    .append("g")
    .attr("transform","translate(" + margin1.left + "," + margin1.top + ")");
var srs = d3.select(".srs")
    .attr("width",width2 + margin2.left + margin2.right)
    .attr("height",height2 + margin2.top + margin2.bottom)
    .append("g")
    .attr("transform","translate(" + margin2.left + "," + margin2.top + ")");
var playoffs = d3.select(".playoffs")
    .attr("width",width3 + margin3.left + margin3.right)
    .attr("height",height3 + margin3.top + margin3.bottom)
    .append("g")
    .attr("transform","translate(" + margin3.left + "," + margin3.top + ")");
var tip1El = document.getElementById('tip1');
var tip2El = document.getElementById('tip2');
var tip3El = document.getElementById('tip3');
function showTip(el, html, event) {
    el.innerHTML = html;
    el.style.display = 'block';
    moveTip(el, event);
}
function moveTip(el, event) {
    var x = event.pageX + 12, y = event.pageY - 28;
    var w = el.offsetWidth, ww = window.innerWidth;
    if (x + w > ww - 10) x = ww - w - 10;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
}

function update(data) {
x.domain(data.map(function(d){return d.season;}));
regularseason.select(".x.axis").remove();
regularseason.select(".y.axis").remove();
regularseason.selectAll(".label").remove();
playoffs.selectAll("text").remove();
playoffs.select(".y.axis").remove();
srs.select(".x.axis").remove();
srs.select(".y.axis").remove();
regularseason.append("g")
    .attr("class","y axis")
    .call(y1Axis);
srs.append("g")
    .attr("class","y axis")
    .call(y2Axis);
playoffs.append("g")
    .attr("class","y axis")
    .call(y3Axis);
regularseason.append("g")
    .attr("class","x axis")
    .attr("style","font-family: 'courier new'")
    .attr("transform","translate(0," + height1 + ")")
    .call(xAxis)
    .selectAll("text")
    .style("text-anchor","start")
    .attr("dx", -70)
    .attr("dy", -5)
    .attr("transform","rotate(-90)");
regularseason.append('g')
    .selectAll('text')
    .data(data)
    .enter()
    .append('text')
    .attr("class","label")
    .attr('x',function(d,i){return x(d.season)+x.bandwidth()/2;})
    .attr('y',function(d,i){return height1;})
    .transition()
    .duration(750)
    .ease(d3.easeQuad)
    .attr('x',function(d,i){return x(d.season)+x.bandwidth()/2;})
    .attr('y',function(d,i){return y1(d.winpercent)-5;})
    .text(function(d,i){return d.wins;})
    .style("text-anchor","middle");
regularseason.selectAll(".bar1").remove();
regularseason.selectAll(".bar1")
    .data(data)
    .enter()
    .append("rect")
    .attr("class","bar1")
    .attr("x",function(d){return x(d.season);})
    .attr("y",height1)
    .attr("height",0)
    .style("fill","white")
    .style("stroke","white")
    .style("opacity","0")
    .transition()
    .duration(750)
    .ease(d3.easeQuad)
    .attr("y",function(d){return y1(d.winpercent);})
    .attr("height",function(d){return height1 - y1(d.winpercent);})
    .attr("width",x.bandwidth())
    .style("fill",function(d){return d.color1})
    .style("stroke",function(d){return d.color1})
    .style("opacity","1");
regularseason.selectAll(".invisible").remove();
regularseason.selectAll(".invisible")
    .data(data)
    .enter()
    .append("rect")
    .attr("class","invisible")
    .attr("x",function(d){return x(d.season);})
    .attr("y",function(d){return y1(d.winpercent);})
    .attr("height",function(d){return height1 - y1(d.winpercent);})
    .attr("width",x.bandwidth())
    .style("fill","white")
    .style("stroke","white")
    .style("opacity","0")
    .on('mouseover', function(event, d) {showTip(tip1El, "<table><tr><td rowspan='5' class='logo'><img src='" + d.logo + "'></td><th>Season</th><td>" + d.season + "</td></tr><tr><th>Team</th><td>" + d.team + "</td></tr><tr><th>Arena</th><td>" + d.arena + "</td></tr><tr><th>Coach</th><td>" + d.coach + "</td></tr><tr><th>Win share leader</th><td>" + d.topWS + "</td></tr></table>", event); d3.select(this).style('opacity','0.4');})
    .on('mousemove', function(event, d) {moveTip(tip1El, event);})
    .on('mouseout', function(event, d) {hideTip(tip1El); d3.select(this).style('opacity','0');})
    .on('touchstart', function(event, d) {showTip(tip1El, "<table><tr><td rowspan='5' class='logo'><img src='" + d.logo + "'></td><th>Season</th><td>" + d.season + "</td></tr><tr><th>Team</th><td>" + d.team + "</td></tr><tr><th>Arena</th><td>" + d.arena + "</td></tr><tr><th>Coach</th><td>" + d.coach + "</td></tr><tr><th>Win share leader</th><td>" + d.topWS + "</td></tr></table>", event.touches[0]); event.preventDefault();})
    .on('touchend', function() {setTimeout(function(){hideTip(tip1El);},1500);});

    .on('mouseover', function(event, d) { var html = d.opponent4 ? d.opponent4 + '<br>' + d.opponent3 + '<br>' + d.opponent2 + '<br>' + d.opponent1 : d.opponent3 ? d.opponent3 + '<br>' + d.opponent2 + '<br>' + d.opponent1 : d.opponent2 ? d.opponent2 + '<br>' + d.opponent1 : d.opponent1; showTip(tip3El, html, event); d3.select(this).style('opacity','0.4');})
    .on('mousemove', function(event, d) {moveTip(tip3El, event);})
    .on('mouseout', function(event, d) {hideTip(tip3El); d3.select(this).style('opacity','0');})
    .on('touchstart', function(event, d) { var html = d.opponent4 ? d.opponent4 + '<br>' + d.opponent3 + '<br>' + d.opponent2 + '<br>' + d.opponent1 : d.opponent3 ? d.opponent3 + '<br>' + d.opponent2 + '<br>' + d.opponent1 : d.opponent2 ? d.opponent2 + '<br>' + d.opponent1 : d.opponent1; showTip(tip3El, html, event.touches[0]); event.preventDefault();})
    .on('touchend', function() {setTimeout(function(){hideTip(tip3El);},1500);});
}
